<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>Закулисье</title>

<style>
* {
    box-sizing: border-box;
    touch-action: none;
}

body {
    margin: 0;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#joystick {
    position: fixed;
    left: 20px;
    bottom: 25px;

    width: 125px;
    height: 125px;

    border-radius: 50%;

    background: rgba(255,255,255,.13);
    border: 2px solid rgba(255,255,255,.25);

    z-index: 20;
}

#stick {
    position: absolute;

    width: 55px;
    height: 55px;

    left: 33px;
    top: 33px;

    border-radius: 50%;

    background: rgba(255,255,255,.45);
}

#look {
    position: fixed;

    right: 0;
    top: 0;

    width: 70%;
    height: 100%;

    z-index: 10;
}

#title {
    position: fixed;

    top: 12px;
    left: 50%;

    transform: translateX(-50%);

    color: white;

    font-size: 22px;
    font-weight: bold;

    z-index: 30;

    text-shadow:
        0 2px 5px black,
        0 0 10px black;
}

#counter {
    position: fixed;

    top: 48px;
    left: 50%;

    transform: translateX(-50%);

    color: white;

    font-size: 20px;

    z-index: 30;

    background: rgba(0,0,0,.45);

    padding: 6px 13px;

    border-radius: 12px;

    text-shadow: 0 2px 5px black;
}

#message {
    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%,-50%);

    width: 90%;

    text-align: center;

    color: white;

    font-size: 30px;
    font-weight: bold;

    z-index: 100;

    display: none;

    text-shadow:
        0 3px 15px black,
        0 0 20px black;
}

#scare {
    position: fixed;

    inset: 0;

    background: black;

    display: none;

    align-items: center;
    justify-content: center;

    z-index: 200;
}

#scare img {
    width: 100%;
    height: 100%;

    object-fit: contain;

    filter:
        contrast(1.4)
        brightness(1.3);
}

#scareText {
    position: absolute;

    color: white;

    font-size: 30px;
    font-weight: bold;

    text-shadow: 0 0 15px black;
}
</style>
</head>

<body>

<div id="title">
    ЗАКУЛИСЬЕ
</div>

<div id="counter">
    🍎 0 / 10
</div>

<div id="message"></div>

<div id="scare">
    <img id="scareImage"
         src="InShot_20260725_113653092.png">

    <div id="scareText">
        ТЕБЯ ПОЙМАЛИ
    </div>
</div>

<div id="joystick">
    <div id="stick"></div>
</div>

<div id="look"></div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================================================
   НАСТРОЙКИ
========================================================= */

const MAP_SIZE = 90;

const WALL_HEIGHT = 4;

const PLAYER_HEIGHT = 1.7;

const PLAYER_SPEED = 3.2;

const APPLE_COUNT = 10;

/*
   Минимальное расстояние между яблоками.
   Увеличь, например, до 12,
   если хочешь ещё сильнее разбросать их.
*/
const MIN_APPLE_DISTANCE = 9;


/* =========================================================
   СЦЕНА
========================================================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x15120a);

scene.fog =
    new THREE.Fog(
        0x15120a,
        12,
        55
    );


/* =========================================================
   КАМЕРА
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        75,
        innerWidth / innerHeight,
        0.1,
        150
    );

camera.position.set(
    0,
    PLAYER_HEIGHT,
    5
);


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio, 2)
);

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   СВЕТ
========================================================= */

const ambient =
    new THREE.AmbientLight(
        0xffe7a0,
        1.0
    );

scene.add(ambient);


/* =========================================================
   ПОЛ
========================================================= */

const floorMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x554b22
    });

const floor =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            MAP_SIZE,
            MAP_SIZE
        ),
        floorMaterial
    );

floor.rotation.x =
    -Math.PI / 2;

floor.position.y = 0;

scene.add(floor);


/* =========================================================
   ПРОЦЕДУРНАЯ КАРТА
========================================================= */

const wallMaterial =
    new THREE.MeshStandardMaterial({
        color: 0xb8a84d
    });


const walls = [];


/*
   Создаём стену
*/
function createWall(
    x,
    z,
    width,
    depth
) {

    const wall =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                WALL_HEIGHT,
                depth
            ),
            wallMaterial
        );

    wall.position.set(
        x,
        WALL_HEIGHT / 2,
        z
    );

    scene.add(wall);

    walls.push({
        mesh: wall,
        x: x,
        z: z,
        width: width,
        depth: depth
    });
}


/*
   Границы карты
*/
createWall(
    0,
    -MAP_SIZE / 2,
    MAP_SIZE,
    0.6
);

createWall(
    0,
    MAP_SIZE / 2,
    MAP_SIZE,
    0.6
);

createWall(
    -MAP_SIZE / 2,
    0,
    0.6,
    MAP_SIZE
);

createWall(
    MAP_SIZE / 2,
    0,
    0.6,
    MAP_SIZE
);


/*
   Случайные стены.
   Они образуют большой лабиринт.
*/
function generateMaze() {

    const gridSize = 10;

    const spacing =
        MAP_SIZE / gridSize;

    for (
        let gx = -gridSize / 2;
        gx < gridSize / 2;
        gx++
    ) {

        for (
            let gz = -gridSize / 2;
            gz < gridSize / 2;
            gz++
        ) {

            /*
               Иногда оставляем проход.
            */
            if (Math.random() < 0.35) {
                continue;
            }


            /*
               Не ставим стены слишком близко
               к старту игрока.
            */
            const worldX =
                gx * spacing + spacing / 2;

            const worldZ =
                gz * spacing + spacing / 2;


            if (
                Math.abs(worldX) < 12 &&
                Math.abs(worldZ) < 12
            ) {
                continue;
            }


            /*
               Вертикальная или горизонтальная стена.
            */
            if (Math.random() < 0.5) {

                createWall(
                    worldX,
                    worldZ,
                    0.6,
                    spacing * 0.8
                );

            } else {

                createWall(
                    worldX,
                    worldZ,
                    spacing * 0.8,
                    0.6
                );
            }
        }
    }
}

generateMaze();


/* =========================================================
   ПОТОЛОК
========================================================= */

const ceiling =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            MAP_SIZE,
            MAP_SIZE
        ),
        new THREE.MeshStandardMaterial({
            color: 0xaaa46b
        })
    );

ceiling.rotation.x =
    Math.PI / 2;

ceiling.position.y =
    WALL_HEIGHT;

scene.add(ceiling);


/* =========================================================
   ЛАМПЫ
========================================================= */

function createLamp(
    x,
    z
) {

    const light =
        new THREE.PointLight(
            0xffe8a0,
            3.5,
            10
        );

    light.position.set(
        x,
        3.8,
        z
    );

    scene.add(light);


    const bulb =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.5,
                .08,
                .35
            ),
            new THREE.MeshBasicMaterial({
                color: 0xffffcc
            })
        );

    bulb.position.set(
        x,
        3.85,
        z
    );

    scene.add(bulb);
}


/*
   Лампы по всей огромной карте.
*/
for (
    let x = -40;
    x <= 40;
    x += 10
) {

    for (
        let z = -40;
        z <= 40;
        z += 10
    ) {

        createLamp(x,z);
    }
}


/* =========================================================
   ЯБЛОКИ
========================================================= */

let apples = [];

let collected = 0;


/*
   Проверяем, можно ли поставить яблоко
*/
function canPlaceApple(
    x,
    z,
    positions
) {

    /*
       Не ставим слишком близко к старту.
    */
    if (
        Math.sqrt(
            x*x + z*z
        ) < 10
    ) {
        return false;
    }


    /*
       Не ставим яблоки слишком близко друг к другу.
    */
    for (
        const p of positions
    ) {

        const dx =
            x - p.x;

        const dz =
            z - p.z;

        const distance =
            Math.sqrt(
                dx*dx + dz*dz
            );

        if (
            distance <
            MIN_APPLE_DISTANCE
        ) {
            return false;
        }
    }

    return true;
}


/*
   Получаем случайные позиции яблок.
*/
function generateApplePositions() {

    const positions = [];

    let attempts = 0;


    while (
        positions.length < APPLE_COUNT &&
        attempts < 5000
    ) {

        attempts++;


        const x =
            THREE.MathUtils.randFloat(
                -MAP_SIZE/2 + 5,
                MAP_SIZE/2 - 5
            );

        const z =
            THREE.MathUtils.randFloat(
                -MAP_SIZE/2 + 5,
                MAP_SIZE/2 - 5
            );


        if (
            canPlaceApple(
                x,
                z,
                positions
            )
        ) {

            positions.push({
                x,
                z
            });
        }
    }


    return positions;
}


/*
   Создаём яблоко.
*/
function createApple(
    x,
    z
) {

    const group =
        new THREE.Group();


    /*
       Красное яблоко.
    */
    const body =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .38,
                16,
                16
            ),
            new THREE.MeshStandardMaterial({
                color: 0xff2020,

                emissive: 0x440000
            })
        );

    body.scale.y = 1.1;

    group.add(body);


    /*
       Палочка.
    */
    const stem =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .045,
                .055,
                .22,
                8
            ),
            new THREE.MeshStandardMaterial({
                color: 0x4b2410
            })
        );

    stem.position.y = .42;

    group.add(stem);


    /*
       Листик.
    */
    const leaf =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .13,
                10,
                8
            ),
            new THREE.MeshStandardMaterial({
                color: 0x29a329
            })
        );

    leaf.scale.set(
        1.5,
        .35,
        .7
    );

    leaf.position.set(
        .13,
        .48,
        0
    );

    group.add(leaf);


    group.position.set(
        x,
        .45,
        z
    );


    scene.add(group);


    apples.push({
        mesh: group,
        x: x,
        z: z,
        taken: false
    });
}


const applePositions =
    generateApplePositions();


for (
    const p of applePositions
) {

    createApple(
        p.x,
        p.z
    );
}


/* =========================================================
   МОНСТР
========================================================= */

let monster = null;

let monsterActive = false;


/*
   Здесь используется твой файл монстра.
*/
const monsterTexture =
    new THREE.TextureLoader().load(
        "InShot_20260725_113653092.png"
    );


monsterTexture.colorSpace =
    THREE.SRGBColorSpace;


const monsterMaterial =
    new THREE.MeshBasicMaterial({

        map: monsterTexture,

        transparent: true,

        depthWrite: false,

        side: THREE.DoubleSide
    });


monster =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            3,
            3
        ),
        monsterMaterial
    );


monster.visible = false;

scene.add(monster);


/* =========================================================
   ПОЯВЛЕНИЕ МОНСТРА
========================================================= */

function spawnMonster() {

    if (
        !monster ||
        monsterActive
    ) {
        return;
    }


    /*
       Появляется позади игрока.
    */

    const behind =
        new THREE.Vector3(
            0,
            0,
            1
        );


    behind.applyAxisAngle(
        new THREE.Vector3(
            0,
            1,
            0
        ),
        yaw
    );


    monster.position.copy(
        camera.position
    );


    monster.position.y =
        1.5;


    monster.position.addScaledVector(
        behind,
        8
    );


    monster.visible = true;

    monsterActive = true;
}


/*
   Убираем монстра.
*/
function hideMonster() {

    if (!monster) {
        return;
    }

    monster.visible = false;

    monsterActive = false;
}


/* =========================================================
   ЗВУКИ
========================================================= */

const backroomsMusic =
    new Audio("backrooms.mp3");

backroomsMusic.loop = true;

backroomsMusic.volume = 0.35;


const jumpscareSound =
    new Audio("sharp-skimmer.mp3");

jumpscareSound.volume = 1.0;


/*
   Телефон запрещает автозапуск звука.
   Поэтому начинаем музыку после первого касания.
*/
let audioStarted = false;


function startMusic() {

    if (audioStarted) {
        return;
    }

    audioStarted = true;

    backroomsMusic.play()
        .catch(() => {});
}


document.addEventListener(
    "touchstart",
    startMusic,
    {
        once: false
    }
);


/* =========================================================
   УПРАВЛЕНИЕ
========================================================= */

let moveX = 0;
let moveY = 0;


const joystick =
    document.getElementById(
        "joystick"
    );

const stick =
    document.getElementById(
        "stick"
    );


let joyTouch = null;


joystick.addEventListener(
    "touchstart",
    e => {

        e.preventDefault();

        startMusic();

        joyTouch =
            e.changedTouches[0]
            .identifier;
    }
);


joystick.addEventListener(
    "touchmove",
    e => {

        e.preventDefault();

        for (
            const t of e.changedTouches
        ) {

            if (
                t.identifier !==
                joyTouch
            ) {
                continue;
            }


            const rect =
                joystick.getBoundingClientRect();


            let x =
                t.clientX -
                (rect.left + 62.5);


            let y =
                t.clientY -
                (rect.top + 62.5);


            const max = 43;


            const length =
                Math.sqrt(
                    x*x + y*y
                );


            if (
                length > max
            ) {

                x =
                    x / length * max;

                y =
                    y / length * max;
            }


            stick.style.transform =
                `translate(${x}px,${y}px)`;


            moveX =
                x / max;

            moveY =
                y / max;
        }
    }
);


function joystickEnd(e) {

    for (
        const t of e.changedTouches
    ) {

        if (
            t.identifier ===
            joyTouch
        ) {

            moveX = 0;
            moveY = 0;

            stick.style.transform =
                "translate(0,0)";

            joyTouch = null;
        }
    }
}


joystick.addEventListener(
    "touchend",
    joystickEnd
);

joystick.addEventListener(
    "touchcancel",
    joystickEnd
);


/* =========================================================
   ОБЗОР
========================================================= */

const look =
    document.getElementById(
        "look"
    );


let lookTouch = null;

let lastX = 0;
let lastY = 0;

let yaw = 0;
let pitch = 0;


look.addEventListener(
    "touchstart",
    e => {

        e.preventDefault();

        startMusic();

        const t =
            e.changedTouches[0];

        lookTouch =
            t.identifier;

        lastX =
            t.clientX;

        lastY =
            t.clientY;
    }
);


look.addEventListener(
    "touchmove",
    e => {

        e.preventDefault();

        for (
            const t of e.changedTouches
        ) {

            if (
                t.identifier !==
                lookTouch
            ) {
                continue;
            }


            const dx =
                t.clientX - lastX;

            const dy =
                t.clientY - lastY;


            yaw -=
                dx * .004;

            pitch -=
                dy * .004;


            pitch =
                Math.max(
                    -1.4,
                    Math.min(
                        1.4,
                        pitch
                    )
                );


            lastX =
                t.clientX;

            lastY =
                t.clientY;
        }
    }
);


look.addEventListener(
    "touchend",
    e => {

        for (
            const t of e.changedTouches
        ) {

            if (
                t.identifier ===
                lookTouch
            ) {

                lookTouch = null;
            }
        }
    }
);


/* =========================================================
   СБОР ЯБЛОКА
========================================================= */

const counter =
    document.getElementById(
        "counter"
    );


const message =
    document.getElementById(
        "message"
    );


function collectApple(
    apple
) {

    if (
        apple.taken
    ) {
        return;
    }


    apple.taken = true;


    scene.remove(
        apple.mesh
    );


    collected++;


    counter.textContent =
        `🍎 ${collected} / ${APPLE_COUNT}`;


    /*
       После первого яблока
       начинается охота.
    */
    if (
        collected === 1
    ) {

        spawnMonster();
    }


    /*
       Все яблоки собраны.
    */
    if (
        collected >= APPLE_COUNT
    ) {

        hideMonster();


        message.innerHTML =
            "🎉 ТЫ СОБРАЛ ВСЕ ЯБЛОКИ!<br>" +
            "<small>ТЫ ВЫБРАЛСЯ ИЗ ЗАКУЛИСЬЯ</small>";


        message.style.display =
            "block";
    }
}


/* =========================================================
   СКРИМЕР
========================================================= */

function jumpscare() {

    /*
       Останавливаем музыку.
    */
    backroomsMusic.pause();


    /*
       Воспроизводим резкий звук.
    */
    jumpscareSound.currentTime = 0;

    jumpscareSound.play()
        .catch(() => {});


    const scare =
        document.getElementById(
            "scare"
        );


    scare.style.display =
        "flex";


    /*
       Через 1.3 секунды
       перезапускаем игру.
    */
    setTimeout(() => {

        scare.style.display =
            "none";


        resetGame();

    }, 1300);
}


/* =========================================================
   СБРОС ИГРЫ
========================================================= */

function resetGame() {

    collected = 0;


    counter.textContent =
        `🍎 0 / ${APPLE_COUNT}`;


    /*
       Возвращаем яблоки.
    */
    for (
        let i = 0;
        i < apples.le
